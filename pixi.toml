[workspace]
authors = ["Anonymous"]
channels = ["conda-forge"]
name = "mutation_ddg"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
results = "python scripts/main_results.py"
decay = "python scripts/decay_fit.py"
figure-benchmark = "python scripts/figure_benchmark.py"
figure-scatter = "python scripts/figure_scatter.py"
figure-locality = "python scripts/figure_locality_and_probe.py"

[activation.env]
PYTHONPATH = "src"

[dependencies]
python = ">=3.12,<3.14"
pandas = ">=3.0.3,<4"
pyarrow = ">=24.0.0,<25"
numpy = ">=2.0,<3"
scipy = ">=1.14,<2"
matplotlib = ">=3.11.1,<4"
biopython = ">=1.84,<2"
pyyaml = ">=6.0,<7"
rdkit = ">=2026.3.5,<2027"
